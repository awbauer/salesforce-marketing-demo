name: Verify

# Every gate in `pnpm verify` (format, lint, types, unit and worker tests, evals, contracts, docs,
# Learn, build) and the Playwright suite, on every pull request and push to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Learn gate diffs against the merge base and reads commit trailers.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        env:
          LEARN_BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [ -z "$LEARN_BASE_REF" ]; then unset LEARN_BASE_REF; fi
          pnpm verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Playwright
        run: pnpm exec playwright install --with-deps chrome

      - name: End-to-end tests (Chrome and Edge projects)
        run: pnpm test:e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
